version: '3.8'

# ==========================================
# DOCKER COMPOSE PRODUCTION - Agent PEA
# ==========================================
#
# Ce fichier utilise Docker Secrets pour sécuriser les variables sensibles
# en production (déploiement VPS).
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d --build
#
# Prérequis:
#   1. Créer les fichiers secrets dans ./secrets/
#   2. Utiliser scripts/setup_secrets.sh pour automatiser
#   3. Vérifier que secrets/*.txt ont les permissions 600
#
# ==========================================

services:
  # ==========================================
  # API FastAPI
  # ==========================================
  api:
    build: .
    container_name: agent-pea-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./api/data/uploads:/app/api/data/uploads

    # Variables d'environnement NON-SENSIBLES
    environment:
      - API_BASE_URL=http://api:8000
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      # Les secrets sont lus depuis /run/secrets/ par api/security.py

    # Docker Secrets pour variables sensibles
    secrets:
      - telegram_bot_token
      - anthropic_api_key
      - openai_api_key
      - newsapi_key
      - jwt_secret_key
      - api_password

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - agent-pea-network

    # Limites de ressources (optionnel mais recommandé en production)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==========================================
  # Bot Telegram
  # ==========================================
  telegram-bot:
    build: .
    container_name: agent-pea-telegram-bot
    restart: unless-stopped
    command: python telegram_bot_main.py
    volumes:
      - ./data:/app/data

    environment:
      - API_BASE_URL=http://api:8000
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO

    secrets:
      - telegram_bot_token
      - anthropic_api_key
      - openai_api_key
      - newsapi_key

    depends_on:
      api:
        condition: service_healthy

    networks:
      - agent-pea-network

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ==========================================
  # Scheduler (rapports automatiques)
  # ==========================================
  scheduler:
    build: .
    container_name: agent-pea-scheduler
    restart: unless-stopped
    command: python telegram_scheduler.py
    volumes:
      - ./data:/app/data

    environment:
      - API_BASE_URL=http://api:8000
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO

    secrets:
      - telegram_bot_token
      - anthropic_api_key
      - openai_api_key
      - newsapi_key

    depends_on:
      api:
        condition: service_healthy

    networks:
      - agent-pea-network

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

# ==========================================
# DOCKER SECRETS
# ==========================================
#
# Les secrets sont lus depuis des fichiers locaux.
# En production, vous pouvez utiliser Docker Swarm pour
# gérer les secrets de manière encore plus sécurisée.
#
# Permissions recommandées: chmod 600 secrets/*.txt
# ==========================================

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  newsapi_key:
    file: ./secrets/newsapi_key.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  api_password:
    file: ./secrets/api_password.txt

# ==========================================
# NETWORKS
# ==========================================

networks:
  agent-pea-network:
    driver: bridge

# ==========================================
# VOLUMES
# ==========================================

volumes:
  data:
    driver: local

# ==========================================
# NOTES DE SÉCURITÉ
# ==========================================
#
# 1. SECRETS:
#    - Jamais commiter secrets/*.txt dans Git
#    - Utiliser .gitignore pour exclure secrets/
#    - Permissions 600 (rw-------) pour tous les fichiers secrets
#    - Rotation régulière des secrets (mensuelle recommandée)
#
# 2. ACCÈS RÉSEAU:
#    - Port 8000 exposé uniquement si nécessaire
#    - Utiliser Nginx reverse proxy avec SSL/TLS
#    - Activer UFW firewall sur le VPS
#    - Considérer l'utilisation de fail2ban
#
# 3. RESSOURCES:
#    - Limites CPU/RAM configurées pour éviter le DoS
#    - Monitoring avec docker stats
#    - Logs rotatés automatiquement
#
# 4. BACKUPS:
#    - Sauvegarder ./data/ régulièrement
#    - Sauvegarder ./secrets/ dans un coffre-fort sécurisé
#    - Tester les restaurations
#
# 5. MISES À JOUR:
#    - Vérifier les vulnérabilités: docker scan
#    - Mettre à jour les images régulièrement
#    - Tester en staging avant prod
#
# ==========================================
