version: '3.8'

services:
  # API FastAPI
  api:
    build: .
    container_name: agent-pea-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./api/data/uploads:/app/api/data/uploads
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # 2 minutes pour charger TensorFlow/PyTorch
    networks:
      - agent-pea-network

  # Bot Telegram
  telegram-bot:
    build: .
    container_name: agent-pea-telegram-bot
    restart: unless-stopped
    command: python telegram_bot_main.py
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - agent-pea-network

  # Scheduler (rapports automatiques)
  scheduler:
    build: .
    container_name: agent-pea-scheduler
    restart: unless-stopped
    command: python telegram_scheduler.py
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - agent-pea-network

networks:
  agent-pea-network:
    driver: bridge

volumes:
  data:
    driver: local
